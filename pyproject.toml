[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygv-docs"
version = "0.0.0"
description = "Public documentation site for PyGV"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
extend-exclude = ["docs/gallery"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

