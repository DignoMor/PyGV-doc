name: Documentation site

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the deploy job below widens permissions, so
# pull-request runs can never write to Pages or request an identity token.
permissions:
  contents: read

# A newer run for the same ref replaces an older one instead of racing it.
concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both channels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable_available: ${{ steps.stable_source.outputs.available }}
    steps:
      # Each channel is built from its own documentation branch, and each
      # branch's tools/build_docs.py reads that branch's code-ref.json and
      # validates that the pinned code commit belongs to the paired branch.
      - name: Check out documentation main (stable)
        uses: actions/checkout@v4
        with:
          ref: main
          path: doc-main
          fetch-depth: 0
      - name: Check out documentation dev (development)
        uses: actions/checkout@v4
        with:
          # On pull requests, build the proposed head so the artifact shows the
          # change under review; on pushes and manual dispatch, the dev branch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'dev' }}
          path: doc-dev
          fetch-depth: 0
      # The first release PR has only a placeholder on main. Validate dev now;
      # publish the combined site once main has a stable manifest and builder.
      - name: Detect stable documentation source
        id: stable_source
        run: |
          if [ -f doc-main/tools/build_docs.py ] && \
             [ -f doc-main/code-ref.json ] && \
             python -c 'import json; m = json.load(open("doc-main/code-ref.json")); assert m["channel"] == "stable" and m["branch"] == "main"'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r doc-dev/requirements.txt

      # build_docs.py is the single strict build gate. It resolves and checks
      # out the paired code commit, runs Sphinx with -W --keep-going, and
      # executes the gallery. --no-install keeps the two paired checkouts from
      # fighting over the same import name; conf.py imports the checkout
      # directly from PYGV_CODE_DIR.
      - name: Build stable channel
        if: steps.stable_source.outputs.available == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          python doc-main/tools/build_docs.py \
            --channel stable \
            --no-install \
            --outdir "$RUNNER_TEMP/channels/stable"
      - name: Build development channel
        env:
          MPLBACKEND: Agg
        run: |
          python doc-dev/tools/build_docs.py \
            --channel development \
            --no-install \
            --outdir "$RUNNER_TEMP/channels/development"

      # The same suite of authored-content, API, gallery, link-resolution, and
      # agent-artifact checks runs against both built channels.
      - name: Validate stable channel
        if: steps.stable_source.outputs.available == 'true'
        env:
          MPLBACKEND: Agg
          PYGV_DOC_BUILD: ${{ runner.temp }}/channels/stable
        run: python -m pytest doc-main/tests -q
      - name: Validate development channel
        env:
          MPLBACKEND: Agg
          PYGV_DOC_BUILD: ${{ runner.temp }}/channels/development
        run: python -m pytest doc-dev/tests -q

      # Link checking is part of the strict gate for authored pages, generated
      # API reference, gallery navigation, and agent-facing links.
      - name: Link check stable channel
        if: steps.stable_source.outputs.available == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          python doc-main/tools/build_docs.py \
            --channel stable \
            --no-install \
            --builder linkcheck \
            --outdir "$RUNNER_TEMP/linkcheck/stable"
      - name: Link check development channel
        env:
          MPLBACKEND: Agg
        run: |
          python doc-dev/tools/build_docs.py \
            --channel development \
            --no-install \
            --builder linkcheck \
            --outdir "$RUNNER_TEMP/linkcheck/development"

      # One fresh aggregate is rebuilt from both channels every run, so a
      # single channel's build cannot erase the other.
      - name: Assemble two-channel site
        if: steps.stable_source.outputs.available == 'true'
        run: |
          python doc-dev/tools/assemble_site.py \
            --stable "$RUNNER_TEMP/channels/stable" \
            --development "$RUNNER_TEMP/channels/development" \
            --outdir "$RUNNER_TEMP/site"

      - name: Upload inspectable site artifact
        if: steps.stable_source.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/site
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Pull requests validate only: they never reach this job, so they never
    # invoke configure-pages, upload-pages-artifact, or deploy-pages.
    if: github.event_name != 'pull_request' && needs.build.outputs.stable_available == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; a newer deploy cancels an older in-flight one so
    # stale output cannot replace newer output.
    concurrency:
      group: docs-site-pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download assembled site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
